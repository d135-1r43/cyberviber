[platformio]
default_envs = cyd24r

; cyberviber firmware. Default: ESP32-2432S024R (2.4"). The 2.8" ESP32-2432S028R builds with -e cyd28r.
; Flash:  cyberviber release && pio run -t upload            (2.4")
;         cyberviber release && pio run -e cyd28r -t upload  (2.8")

[env:cyd24r]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    lvgl/lvgl@9.2.2
    lovyan03/LovyanGFX@1.2.7
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

; same firmware, but every touch is reported as {"type":"log","raw":[x,y],"pt":[x,y]} (calibration)
[env:cyd24r-touchlog]
extends = env:cyd24r
build_flags = ${env:cyd24r.build_flags} -DCV_TOUCH_LOG

; ESP32-2432S028R (2.8"): backlight on GPIO 21, touch on its own pins; see src/board_config.h
[env:cyd28r]
extends = env:cyd24r
build_flags = ${env:cyd24r.build_flags} -DCV_BOARD_CYD28R

[env:cyd28r-touchlog]
extends = env:cyd28r
build_flags = ${env:cyd28r.build_flags} -DCV_TOUCH_LOG
